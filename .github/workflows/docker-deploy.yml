name: Build and Push Docker

on:
  push:
    branches: main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: me-3d-dashboard
      REGISTRY: ghcr.io   # ou docker.io pour Docker Hub
      REPO: ${{ github.repository }}

    steps:
      # Checkout le repo
      - uses: actions/checkout@v3

      # Setup Docker Buildx
      - uses: docker/setup-buildx-action@v2

      # Login au registry avec token
      - name: Login to Docker registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_TOKEN }}  # ici le token

      # Build l'image Docker
      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.REPO }}:${{ github.sha }} .

      # Push l'image Docker
      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.REPO }}:${{ github.sha }}

      # Tag latest
      - name: Tag latest
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.REPO }}:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.REPO }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.REPO }}:latest
