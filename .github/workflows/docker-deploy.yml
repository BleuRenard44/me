name: Build, Test and Push Docker

on:
  push:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: me-3d-dashboard
      REGISTRY: ghcr.io
      REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v3

      - uses: docker/setup-buildx-action@v2

      - name: Login to Docker registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Build the Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.REPO }}:${{ github.sha }} .

      # Run container to test it
      - name: Test Docker container
        run: |
          docker run -d --name me3d-test -p 3000:3000 ${{ env.REGISTRY }}/${{ env.REPO }}:${{ github.sha }}
          sleep 10
          curl -f http://localhost:3000 || (echo "Container failed to start" && exit 1)
          docker stop me3d-test
          docker rm me3d-test

      # Push Docker image
      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.REPO }}:${{ github.sha }}

      # Tag latest
      - name: Tag latest
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.REPO }}:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.REPO }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.REPO }}:latest
